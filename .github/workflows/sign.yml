name: ycoo auto sign

on:
  schedule:
    # 主班次：UTC 00:17（北京时间 08:17）。避开整点/半点的调度高峰，
    # GitHub cron 在高峰时段可能延迟数十分钟甚至偶发丢弃班次。
    - cron: '17 0 * * *'
    # 兜底班次：UTC 01:37（北京时间 09:37）。主班次被延迟/丢弃时仍能当天补签。
    - cron: '37 1 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: read

concurrency:
  group: ycoo-sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sign script
        env:
          YCOO_USERNAME: ${{ secrets.YCOO_USERNAME }}
          YCOO_PASSWORD: ${{ secrets.YCOO_PASSWORD }}
          YCOO_QUESTION_ID: ${{ secrets.YCOO_QUESTION_ID }}
          YCOO_ANSWER: ${{ secrets.YCOO_ANSWER }}
        run: python sign.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::签到失败，请检查仓库 Secrets（YCOO_USERNAME / YCOO_PASSWORD）或站点是否改版。"
          exit 1
